name: Deploy to Ubuntu

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Verify clean worktree
        run: |
          set -e
          cd ~/agentic-os
          git update-index -q --refresh
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "Working tree is dirty; refusing in-place deploy."
            exit 1
          fi

      - name: Pull latest code
        run: |
          set -e
          git -C ~/agentic-os fetch --prune origin
          git -C ~/agentic-os checkout main
          git -C ~/agentic-os reset --hard origin/main

      - name: Install user service
        run: |
          set -e
          mkdir -p ~/.config/systemd/user
          cp ~/agentic-os/deploy/agentic-os.service ~/.config/systemd/user/agentic-os.service

      - name: Install deps
        run: |
          set -e
          export PATH="$HOME/.hermes/node/bin:$PATH"
          cd ~/agentic-os
          npm ci

      - name: Build
        run: |
          set -e
          export PATH="$HOME/.hermes/node/bin:$PATH"
          cd ~/agentic-os
          npm run build

      - name: Restart service
        run: |
          set -e
          # The runner has no login session, so wire up the user systemd bus.
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=${XDG_RUNTIME_DIR}/bus"
          systemctl --user daemon-reload
          systemctl --user restart agentic-os
          systemctl --user is-active agentic-os

      - name: Configure Tailscale Serve
        run: |
          set -e
          if ! command -v tailscale >/dev/null 2>&1; then
            echo "tailscale CLI not found; skipping Tailscale Serve."
            exit 0
          fi
          tailscale_ip="$(tailscale ip -4 2>/dev/null | head -n 1 || true)"
          if [ -z "$tailscale_ip" ]; then
            echo "No Tailscale IPv4 address found; skipping Tailscale Serve."
            exit 0
          fi
          serve_target="http://${tailscale_ip}:3017"
          if tailscale serve --yes --bg "$serve_target"; then
            tailscale serve status
            exit 0
          fi
          if command -v sudo >/dev/null 2>&1; then
            # Tailscale may require root unless this user has been set as the operator.
            sudo -n tailscale set --operator="$USER" || true
            tailscale serve --yes --bg "$serve_target" && tailscale serve status && exit 0
            if sudo -n tailscale serve --yes --bg "$serve_target"; then
              sudo -n tailscale serve status
              exit 0
            fi
          fi
          echo "Tailscale Serve was not configured for ${serve_target}."
          echo "Run once on the host: sudo tailscale set --operator=\$USER && tailscale serve --yes --bg ${serve_target}"
          exit 0

      - name: Verify readiness
        run: |
          set -e
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=${XDG_RUNTIME_DIR}/bus"
          health_host="${AGENTIC_HEALTH_HOST:-}"
          if [ -z "$health_host" ] && command -v tailscale >/dev/null 2>&1; then
            health_host="$(tailscale ip -4 2>/dev/null | head -n 1 || true)"
          fi
          health_host="${health_host:-127.0.0.1}"
          health_url="http://${health_host}:3017/api/health"
          for _ in $(seq 1 20); do
            if curl --fail --silent "$health_url" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Readiness check failed for ${health_url}"
          journalctl --user -u agentic-os -n 80 --no-pager || true
          exit 1
